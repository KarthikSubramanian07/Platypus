version: 2

updates:
  # One weekly PR per group keeps the queue short; CI and the ci-ok gate decide whether it merges.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bump"
    groups:
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    # Majors arrive as individual PRs so each breaking change is reviewed on its own.

  - package-ecosystem: github-actions
    # Workflows plus the composite setup action they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: "Bump"
    groups:
      actions:
        patterns: ["*"]
