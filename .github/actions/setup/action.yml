name: Set up Platypus
description: Install pnpm (version from package.json), Node with the pnpm store cached, and the workspace dependencies.

inputs:
  node-version:
    description: Node.js version. Defaults to the one in .nvmrc.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
