name: Darwin smoke

# Live check that Darwin Search and MCP still answer the way the gateway expects.
# Anonymous, read-only, six searches at most twelve requests. Never part of PR CI.
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live Darwin Search and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm darwin:smoke
        env:
          DARWIN_API_KEY: ${{ secrets.DARWIN_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: darwin-smoke-report
          path: darwin-cache/
          retention-days: 14
