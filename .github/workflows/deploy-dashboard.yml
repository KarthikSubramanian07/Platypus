name: Deploy dashboard

# Publishes packages/dashboard to Cloudflare Pages (https://tryplatypus.pages.dev) on every push to main.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID; skips cleanly without them.

on:
  push:
    branches: [main]
    paths:
      - "packages/dashboard/**"
      - "packages/shared/src/testing/fixtures/golden-path.jsonl"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platypus/dashboard build
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the package so wrangler bundles packages/dashboard/functions (Markdown negotiation, 404s).
          workingDirectory: packages/dashboard
          command: pages deploy dist --project-name tryplatypus --branch main
      - name: Explain the skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; built the dashboard but did not deploy."
